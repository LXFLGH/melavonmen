<style>

    --ink: #d9ffe3;

  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #05070a;
    overflow: hidden;
    color: var(--ink);

    -webkit-font-smoothing: antialiased;
  }
  #scene {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
    outline: none;
  }
  /* 屏幕外的暗角，收拢视线 */
  #vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(120% 90% at 50% 42%, rgba(0,0,0,0) 42%, rgba(0,0,0,0.55) 100%);
    z-index: 2;
  }
  #hint {
    position: fixed;
    left: 20px;
    top: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 16px;
    border-radius: 999px;
    background: rgba(10, 16, 13, 0.55);
    border: 1px solid var(--line);
    backdrop-filter: blur(9px);
    -webkit-backdrop-filter: blur(9px);
    font-size: 12.5px;
    letter-spacing: 0.2px;
    color: var(--dim);
    white-space: nowrap;
    z-index: 5;
    transition: opacity 0.8s ease;
    user-select: none;
  }
  #hint.dim { opacity: 0.34; }
  #hint b {
    color: var(--ink);
    font-weight: 600;
    font-family: "Consolas", "SF Mono", Menlo, monospace;
    letter-spacing: 0.6px;
  }
  #hint .tag {
    color: var(--ink);
    font-family: "Consolas", "SF Mono", Menlo, monospace;
    letter-spacing: 1.4px;
    font-size: 11.5px;
    opacity: 0.85;
  }
  #hint .sep { opacity: 0.3; }
  #mute {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 5;
    padding: 7px 13px;
    border-radius: 999px;
    font-size: 12px;
    color: var(--dim);
    background: rgba(10, 16, 13, 0.5);
    border: 1px solid var(--line);
    backdrop-filter: blur(9px);
    -webkit-backdrop-filter: blur(9px);
    cursor: pointer;
    font-family: inherit;
    transition: color 0.2s, opacity 0.2s, border-color 0.2s;
  }
  #mute:hover { color: var(--ink); border-color: rgba(120, 200, 150, 0.4); }
  #mute.off { opacity: 0.5; }
  #fade {
    position: fixed;
    inset: 0;
    background: #05070a;
    z-index: 9;
    pointer-events: none;
    transition: opacity 1.4s ease;
  }
  #fade.gone { opacity: 0; }
  @media (max-width: 620px) {
    #hint { font-size: 10.5px; padding: 7px 11px; left: 12px; top: 12px; max-width: 92vw; white-space: normal; }

===========================

This is not a photograph. Every pixel on the glass is drawn in

  glass        spherical section, R = 6.62 units

  scanlines    beam profile, 1 px period
  glow         16-tap phosphor bloom
  persistence  90 ms decay, per-pixel

  convergence  static error, 0.5 texel

CONTROLS
--------
  drag        orbit the monitor

  click glass focus the terminal
  power knob  click the front panel button

COMMANDS

  SYSINFO DEGAUSS POWER SOUND  EXIT

Try COLOR AMBER. Try DEGAUSS.

Line rate    31.5 kHz / 76 Hz max
Raster       640 x 480 at 60 Hz, 525 lines
Bandwidth    65 MHz (-3 dB)
Phosphor     P1 green, 120 us decay to 10 percent
White point  9300 K, deltas within 0.008
Input        RGB analogue, 0.7 Vpp, 75 ohm
Power        90 W typical, 120 W max
Dimensions   358 x 372 x 400 mm
Weight       14.2 kg

The demo shader reproduces the geometry and the beam
profile, not the electronics: no flyback, no high voltage.

P1  green   525 nm, the classic monochrome terminal
P3  amber   590 nm, easier on the eyes at night
P4  white   television, mixed sulphide
P22 blue    452 nm, used in colour CRTs

Decay time matters more than colour. A short persistence
phosphor smears fast motion; a long one turns a cursor into
a comet. CRT-DOS ships with P1 because that is what the
banks and the airports had.

  COLOR GREEN | AMBER | WHITE | BLUE
