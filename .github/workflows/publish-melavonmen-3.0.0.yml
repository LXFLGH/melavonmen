name: Publish Melavonmen 3.0.0
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-melavonmen-3.0.0.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify archive and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: LXFLGH/melavonmen
        run: |
          set -euo pipefail
          asset=melavonmen-3.0.0.zip
          target=093f6afeffd6d068fba1210509b59cadfaaf445d
          curl --fail --silent --show-error --location --retry 3 -o "$asset" "https://raw.githubusercontent.com/$GH_REPO/$target/downloads/$asset"
          printf '%s  %s\n' 8a04224d9a62081a7aed38e4b8816939adfea489e8caf121cb2cc3357bc373d3 "$asset" | sha256sum --check
          cat > release-notes.md <<'EOF'
          Melavonmen 3.0.0 将代码检索和 Doc/Wiki 工作流打包为一个 Codex 插件。
          
          - 固定 open-codebase-index 0.38.2，提供 23 个 MCP 工具和 5 个提示模板。
          - 支持本地结构索引、定义定位、跨文件调用图、分支刷新和 PR 影响分析。配置嵌入模型后可使用混合检索和相似实现搜索。
          - 修复源码漏收录、悬空符号路由、Wiki 页哈希过期和 Unicode 路径改名漏报。
          - 22 项校验测试与 2 项 Codex 端到端测试通过。
          
          解压后进入 melavonmen-3.0.0，按包内 README.md 安装。
          
          ZIP SHA-256: `8a04224d9a62081a7aed38e4b8816939adfea489e8caf121cb2cc3357bc373d3`
          EOF
          gh release create v3.0.0 "$asset" --target "$target" --title "Melavonmen Skill 3.0.0" --notes-file release-notes.md --latest
