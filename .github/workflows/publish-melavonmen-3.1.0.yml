name: Publish Melavonmen 3.1.0
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-melavonmen-3.1.0.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify archive and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: LXFLGH/melavonmen
        run: |
          set -euo pipefail
          asset=melavonmen-3.1.0.zip
          target=c5df41b0c4524d97b70bc7c5ec4d30dc035b90d6
          curl --fail --silent --show-error --location --retry 3 -o "$asset" "https://raw.githubusercontent.com/$GH_REPO/$target/downloads/$asset"
          printf '%s  %s\n' 5f26a80ea9bc82906124a0599ddd3c2434a6b2515226741c848b5b4e510780da "$asset" | sha256sum --check
          cat > release-notes.md <<'EOF'
          Melavonmen 3.1.0 使用自有 Python 索引、检索和 MCP 服务。基础安装使用 Python 3.10+ 与 SQLite FTS5，已移除 CodeBaseIndex、Node.js 和 npm 依赖。
          
          - 23 个 MCP 工具和 5 个提示模板，包括源码搜索、调用图、架构、分支与 PR 影响、知识库和 GitHub 历史。
          - 结构模式可离线运行。混合检索和相似代码搜索可连接用户选定的嵌入服务。
          - 22 项 Skill 校验、7 项独立后端测试、2 项 Codex 端到端测试通过。嵌入和 GitHub 历史分别通过本地模拟端点和测试数据验证。
          
          安装步骤见发布包的 README.md。升级后请用 index_codebase 生成独立索引。
          
          ZIP SHA-256: `5f26a80ea9bc82906124a0599ddd3c2434a6b2515226741c848b5b4e510780da`
          EOF
          gh release create v3.1.0 "$asset" --target "$target" --title "Melavonmen 3.1.0 · 独立索引" --notes-file release-notes.md --latest
